[package]
name = "table-manners"
description = "Types and schemas of table-manners, the shared contract of the waffle tools: one external interface for squint, rascal and the tools after them"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/markhayden/table-manners"
rust-version = "1.99"
# The crate ships its types and the schemas they embed; vectors, examples and fixtures stay in the
# repository for tools to test against.
include = ["src/**", "schemas/**", "CONTRACT.md", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { version = "0.60", default-features = false }
sha2 = "0.11"

[lints.clippy]
all = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
